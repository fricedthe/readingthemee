<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>namaz</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-bg: rgba(18, 22, 35, 0.95);
            --border-color: rgba(121, 40, 202, 0.3);
            --accent-purple: #7928ca;
            --accent-pink: #ff0080;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            width: 100%; height: 100vh; background-color: var(--bg-color);
            color: var(--text-main); display: flex; justify-content: center; align-items: center; padding: 12px;
        }
        .auth-card {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 0 20px rgba(121, 40, 202, 0.1);
        }
        h1 { font-size: 1.2rem; margin-bottom: 14px; background: linear-gradient(to right, var(--accent-purple), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .mode-selector { display: flex; gap: 6px; margin-bottom: 14px; }
        .mode-btn { flex: 1; padding: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .mode-btn.active { background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; border-color: transparent; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 8px 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: white; font-size: 0.85rem; }
        .input-group input:focus { outline: none; border-color: var(--accent-pink); }
        .action-btn { width: 100%; padding: 10px; background: linear-gradient(to right, var(--accent-purple), var(--accent-pink)); border: none; border-radius: 6px; color: white; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>CYBER CHAT NETWORK</h1>
        <div class="mode-selector">
            <button type="button" class="mode-btn active" id="btn-create" onclick="setMode('create')">グループ作成</button>
            <button type="button" class="mode-btn" id="btn-join" onclick="setMode('join')">グループ参加</button>
        </div>
        <div class="input-group">
            <label for="username">ユーザーネーム</label>
            <input type="text" id="username" placeholder="例: NEO_USER" autocomplete="off">
        </div>
        <div class="input-group">
            <label id="code-label">グループコード (自動生成)</label>
            <input type="text" id="group-code" readonly>
        </div>
        <button class="action-btn" onclick="submitGate()">ネットワークに接続</button>
    </div>

    <script>
        let currentMode = 'create';
        function generateRandomCode() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }
        document.getElementById('group-code').value = generateRandomCode();

        function setMode(mode) {
            currentMode = mode;
            const btnCreate = document.getElementById('btn-create');
            const btnJoin = document.getElementById('btn-join');
            const codeInput = document.getElementById('group-code');
            const codeLabel = document.getElementById('code-label');
            if (mode === 'create') {
                btnCreate.classList.add('active'); btnJoin.classList.remove('active');
                codeLabel.innerText = "グループコード (自動生成)";
                codeInput.value = generateRandomCode(); codeInput.readOnly = true;
            } else {
                btnCreate.classList.remove('active'); btnJoin.classList.add('active');
                codeLabel.innerText = "グループコードを入力";
                codeInput.value = ""; codeInput.readOnly = false; codeInput.placeholder = "例: X7R92B";
            }
        }

        function submitGate() {
            const user = document.getElementById('username').value.trim();
            const code = document.getElementById('group-code').value.trim();
            if (!user || !code) { alert('入力内容を確認してください。'); return; }
            
            // 次のチャット画面へパラメータを渡して移動
            window.location.href = `chat.html?user=${encodeURIComponent(user)}&code=${encodeURIComponent(code)}`;
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Chat - Room</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-bg: #121623;
            --border-color: rgba(121, 40, 202, 0.3);
            --accent-purple: #7928ca;
            --accent-pink: #ff0080;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100vh; background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }
        
        #chat-screen { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--panel-bg); }
        .chat-header { padding: 10px 14px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .room-info h2 { font-size: 0.85rem; letter-spacing: 0.5px; }
        .room-code-display { font-size: 0.7rem; color: var(--accent-pink); background: rgba(255, 0, 128, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255, 0, 128, 0.15); font-family: monospace; }
        
        .messages-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-row { display: flex; flex-direction: column; max-width: 85%; }
        .msg-row.me { align-self: flex-end; align-items: flex-end; }
        .msg-row.other { align-self: flex-start; align-items: flex-start; }
        .msg-info { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 1px; }
        .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; line-height: 1.3; word-break: break-all; }
        .me .msg-bubble { background: linear-gradient(135deg, var(--accent-purple), #50148c); color: white; border-bottom-right-radius: 2px; }
        .other .msg-bubble { background: rgba(255, 255, 255, 0.06); color: var(--text-main); border-bottom-left-radius: 2px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .system-msg { align-self: center; font-size: 0.7rem; color: var(--text-muted); background: rgba(255,255,255,0.02); padding: 3px 10px; border-radius: 10px; font-style: italic; }
        
        .chat-input-area { padding: 10px 12px; background: rgba(0, 0, 0, 0.3); border-top: 1px solid var(--border-color); display: flex; gap: 6px; }
        .chat-input-area input { flex: 1; padding: 8px 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: white; font-size: 0.85rem; }
        .chat-input-area input:focus { outline: none; border-color: var(--accent-purple); }
        .send-btn { padding: 0 14px; background: linear-gradient(to right, var(--accent-purple), var(--accent-pink)); border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="chat-screen">
        <div class="chat-header">
            <div class="room-info"><h2 id="display-room-title">ROOM: -----</h2></div>
            <div><span class="room-code-display" id="display-room-code">-----</span></div>
        </div>
        <div class="messages-container" id="messages-box"></div>
        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        // URLパラメータからユーザー名とコードを取得
        const urlParams = new URLSearchParams(window.location.search);
        const myUsername = urlParams.get('user') || 'ANON';
        const myGroupCode = urlParams.get('code') || '000000';

        document.getElementById('display-room-title').innerText = `ROOM: ${myGroupCode}`;
        document.getElementById('display-room-code').innerText = myGroupCode;

        // ページ読み込み時に即時参加通知
        sendSystemMessage(`${myUsername} が参加しました。`);
        initStorageListener();

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const msgData = {
                type: 'user',
                id: Date.now() + Math.random().toString(),
                group: myGroupCode,
                sender: myUsername,
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            appendMessage(msgData, true);
            localStorage.setItem('chat_relay_packet', JSON.stringify(msgData));
            input.value = '';
        }

        function sendSystemMessage(text) {
            const msgData = { type: 'system', id: Date.now() + Math.random().toString(), group: myGroupCode, text: text };
            appendMessage(msgData, false);
            localStorage.setItem('chat_relay_packet', JSON.stringify(msgData));
        }

        function appendMessage(data, isMe) {
            if (data.group !== myGroupCode) return;
            const box = document.getElementById('messages-box');
            
            if (data.type === 'system') {
                const sysDiv = document.createElement('div');
                sysDiv.className = 'system-msg';
                sysDiv.innerText = data.text;
                box.appendChild(sysDiv);
            } else {
                const row = document.createElement('div');
                row.className = `msg-row ${isMe ? 'me' : 'other'}`;
                row.innerHTML = `
                    <div class="msg-info">${isMe ? 'あなた' : data.sender} • ${data.time}</div>
                    <div class="msg-bubble">${escapeHTML(data.text)}</div>
                `;
                box.appendChild(row);
            }
            box.scrollTop = box.scrollHeight;
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function initStorageListener() {
            window.addEventListener('storage', (e) => {
                if (e.key === 'chat_relay_packet' && e.newValue) {
                    const data = JSON.parse(e.newValue);
                    if (data.sender !== myUsername) appendMessage(data, false);
                }
            });
        }

        function escapeHTML(str) { return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
    </script>
</body>
</html>
